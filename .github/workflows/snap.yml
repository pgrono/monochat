name: Build Snap candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/snap/**
      - scripts/prepare-snap.cjs
      - tests/snap-smoke.cjs
      - .github/workflows/snap.yml
permissions:
  contents: read
jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/prepare-snap.cjs
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: .runtime/snap-build
      - uses: actions/upload-artifact@v4
        with:
          name: monochat-snap-candidate
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
      - name: Install and connect the test Snap
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP_FILE"
          sudo snap connect monochat:browser-support
          snap connections monochat
      - name: Test the installed Snap
        run: xvfb-run -a node tests/snap-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monochat-snap-smoke
          path: .test-data/snap-smoke.*
