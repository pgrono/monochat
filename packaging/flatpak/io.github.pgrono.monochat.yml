# LOCAL MANIFEST. Confirm identity and replace local sources before submission.
app-id: io.github.pgrono.monochat
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: monochat
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: monochat
    buildsystem: simple
    build-commands:
      - test -f release/linux-unpacked/monochat
      - mkdir -p /app/monochat
      - cp -a release/linux-unpacked/. /app/monochat/
      - install -Dm755 packaging/flatpak/monochat /app/bin/monochat
      - install -Dm644 packaging/monochat.desktop /app/share/applications/io.github.pgrono.monochat.desktop
      - install -Dm644 assets/icons/512x512.png /app/share/icons/hicolor/512x512/apps/io.github.pgrono.monochat.png
      - install -Dm644 packaging/io.github.pgrono.monochat.metainfo.xml /app/share/metainfo/io.github.pgrono.monochat.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - node_modules
          - .validation
          - .git
          - .runtime
          - .test-data
